#Clase 1
spring.application.name=tienda
server.port=8085

#Clase 2 
#Define fecha y hora
logging.pattern.dateformat=hh:mm

#Elimina mensajes invasivos de Spring
spring.main.banner-mode=off

#En desarrollo el 'cache' del servidor (false), en produccion 'true'
spring.thymeleaf.cache=false

#Clase 3
#Conexión local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop

#Usuario y clave de creaTablas.sql
spring.datasource.username=root
spring.datasource.password=root


#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

#clase 4
#Esta información se utiliza para obtener acceso a su storage.
firebase.bucket.name=techshop-4c6f6.firebasestorage.app
firebase.storage.path=techshop
firebase.json.path=firebase
firebase.json.file=techshop-4c6f6-firebase-adminsdk-fbsvc-371243898e.json
